name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install linters (same versions as local)
        run: pip install clang-format==23.1.3 clang-tidy==23.1.3
      - name: Build
        run: make forward
      - name: Test
        run: make test
      - name: Lint
        run: make lint
